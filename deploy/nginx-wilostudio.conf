limit_req_zone $binary_remote_addr zone=wilo_api:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name wilostudio.site www.wilostudio.site;

    client_max_body_size 6M;

    # Debe coincidir con MEDIA_UPLOAD_ROOT. PRIVATE_STORAGE_ROOT nunca se expone por Nginx.
    location ^~ /uploads/ {
        alias /var/lib/wilostudio/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET { deny all; }
    }

    location /api/ {
        limit_req zone=wilo_api burst=15 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
